name: Release

# Pushing a vX.Y.Z tag is the release. Go has no publish step: the module proxy serves the
# tagged commit to anyone who asks, so this workflow cannot undo or block a tag push. It checks
# the tag, creates the GitHub release and asks the proxy for the version so pkg.go.dev lists
# it. A failed check means only that the GitHub release was not created.
#
# workflow_dispatch is a dry run on the selected branch: every check runs against its HEAD, and
# nothing is released or fetched.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check, such as v0.2.0 (default v + Version in client.go). It need not exist.
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Check the tag
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          if [ "$DRY_RUN" = true ] && [ -z "$INPUT_TAG" ]; then
            tag=v$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' client.go)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          .github/scripts/release-check.sh "$tag" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          {
            echo "## Release notes for $tag"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          # A rerun after a later step failed finds the release already there.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the GitHub release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: env.DRY_RUN != 'true'
        with:
          go-version: "1.27.x"
          cache: false
      - name: Ask the module proxy for the version
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/blazingagents/golang-sdk@$TAG"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::proxy.golang.org did not serve $TAG; rerun this job to retry"
          exit 1
