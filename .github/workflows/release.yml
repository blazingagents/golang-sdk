name: Release

# Pushing a vX.Y.Z tag is the release. Go has no publish step: the module proxy serves the
# tagged commit to anyone who asks, so this workflow cannot undo or block a tag push. It checks
# the tag, creates the GitHub release and asks the proxy for the version so pkg.go.dev lists
# it. A failed check means only that the GitHub release was not created.
#
# workflow_dispatch is a dry run on the selected branch: the gate and the checks run against its
# HEAD. The jobs that create the release and fetch the version run only on a tag push.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check, such as v0.2.0 (default v + Version in client.go). It need not exist.
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check:
    name: Check the tag
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$INPUT_TAG" ]; then
            tag=v$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' client.go)
          fi
          notes=$RUNNER_TEMP/notes.md
          .github/scripts/release-check.sh "$tag" "$notes" >> "$GITHUB_OUTPUT"
          delim=EOF-$(openssl rand -hex 16)
          {
            echo "tag=$tag"
            echo "notes<<$delim"
            cat "$notes"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release notes for $tag"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the GitHub release
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          # A rerun after the proxy job failed finds the release already there.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the GitHub release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" --prerelease="$PRERELEASE"

  proxy:
    name: Ask the module proxy for the version
    needs: [check, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
          cache: false
      - env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/blazingagents/golang-sdk@$TAG"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::proxy.golang.org did not serve $TAG; rerun the failed jobs to retry"
          exit 1
